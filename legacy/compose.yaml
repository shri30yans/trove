name: trove

# Supabase hosts Postgres and object storage in both development and production.
# Compose only runs the pinned local Nomic inference service.
services:
  nomic-embeddings:
    build: ./nomic-embedding-service
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      RUN_ENV: local
      HF_HOME: /models/hf
      NOMIC_MODEL_CACHE: /models/hf
      NOMIC_ONNX_THREADS: 2
    volumes:
      - trove-nomic-models:/models/hf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 30s

volumes:
  trove-nomic-models:
