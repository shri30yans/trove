<style>
:root{color-scheme:dark;--page:#111116;--panel:#19191f;--line:#303039;--text:#f3f1f8;--muted:#a7a4b1;--accent:#cbb7f0;font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text)}header{max-width:1280px;margin:auto;padding:42px 24px 24px}h1{font:36px/1.1 Georgia,serif;margin:0 0 10px}.intro{color:var(--muted);max-width:700px;margin:0}.toolbar{display:flex;gap:12px;align-items:center;margin-top:22px;flex-wrap:wrap}.toolbar button{background:#292832;border:1px solid #44414d;color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer}.toolbar button:hover{border-color:var(--accent)}#filter{background:#1c1b22;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);min-width:200px}.hint{font-size:13px;color:var(--muted)}main{max-width:1280px;margin:auto;padding:0 24px 56px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,365px),1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;min-width:0}.card h2{font:22px Georgia,serif;margin:0}.meta{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:4px}.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:15px}.swatch{border:1px solid #ffffff18;border-radius:10px;overflow:hidden;min-width:0;background:#111}.color{height:47px;position:relative}.color input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.info{padding:6px 7px 7px}.role{font-size:11px;color:#d7d4df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hex{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9996a4;margin-top:2px}.swatch.edited{outline:2px solid var(--accent);outline-offset:1px}.note{margin-top:14px;border-left:2px solid #a78bfa;padding:9px 11px;background:#a78bfa10;color:#d8cdee;font-size:13px}.note code{color:#fff}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:440px){header{padding:28px 16px 20px}main{padding:0 16px 36px}.swatches{grid-template-columns:repeat(3,minmax(0,1fr))}h1 </style>

<body>
<header><h1>Trove color palettes</h1><p class="intro">A side-by-side view of every palette currently defined in <code>mobile/src/theme.ts</code>. Click any swatch to preview a new color; the hex value updates in place.</p><div class="toolbar"><input id="filter" type="search" placeholder="Filter palettes or color roles" aria-label="Filter palettes or color roles"><button id="reset">Reset preview edits</button><span class="hint">Edits are preview-only. Copy a hex value into the matching role in <code>mobile/src/theme.ts</code> to apply it.</span></div></header>
<main><section class="grid" id="palettes" aria-live="polite"></section></main>

":"#38265F","petal":"#542B59","lavender":"#4A3378","icyBlue":"#292650","skyBlue":"#3C3978","blueDeep":"#A78BFA","action":"#6C4BC4","onAction":"#F2EDFB","green":"#7CD4A8","greenTint":"#20402F","danger":"#FB7185","dangerTint":"#4A2030","surfacePressed":"#2A1E45","scrim":"rgba(15,9,28,0.66)","night":"#0F0A1C"}},{"label":"Rose","id":"rose","colors":{"background":"#F9EDF1","surface":"#FDF7F9","foreground":"#3A2230","deep":"#3F2233","secondary":"#6B4A5A","muted":"#835B6B","border":"#E8CDD8","borderSoft":"#F1E0E7","thistle":"#F4DDE6","petal":"#F6CDDD","lavender":"#F0D3E0","icyBlue":"#F7E8ED","skyBlue":"#EFC9D7","blueDeep":"#C2437B","action":"#A83469","onAction":"#FDF7F9","green":"#4F7A5E","greenTint":"#E2EDE4","danger":"#BE3A50","dangerTint":"#F8E4E7","surfacePressed":"#F0DDE4","scrim":"rgba(58,34,48,0.38)","night":"#24131C"}},{"label":"Merlot","id":"merlot","colors":{"background":"#230D16","surface":"#2C111C","foreground":"#FBEFF3","deep":"#F2C4D5","secondary":"#D9B8C4","muted":"#AD8997","border":"#542A3C","borderSoft":"#3D1F2D","thistle":"#492438","petal":"#612847","lavender":"#55283D","icyBlue":"#3A202D","skyBlue":"#60314A","blueDeep":"#EB8FB0","action":"#B03A63","onAction":"#FBEFF3","green":"#8FCB9E","greenTint":"#2B4533","danger":"#F87171","dangerTint":"#4A2023","surfacePressed":"#3A1724","scrim":"rgba(25,8,14,0.66)","night":"#180810"}},{"label":"Honey","id":"honey","colors":{"background":"#FDF6DC","surface":"#FFFDF2","foreground":"#3A3018","deep":"#453510","secondary":"#6B5A2E","muted":"#796830","border":"#E6D89E","borderSoft":"#F1E8C4","thistle":"#F5EBC2","petal":"#F6DEB5","lavender":"#EFDF9E","icyBlue":"#FBF1D3","skyBlue":"#EDD98B","blueDeep":"#8A6A08","action":"#8A6A08","onAction":"#FFFDF2","green":"#57792F","greenTint":"#E9EECD","danger":"#B84A28","dangerTint":"#F7E6D8","surfacePressed":"#F2E6BD","scrim":"rgba(61,51,25,0.38)","night":"#241E0F"}}];
const edited=new Map();
const grid=document.querySelector('#palettes');
const filter=document.querySelector('#filter');
function render(){
 const query=filter.value.trim().toLowerCase();
 grid.innerHTML='';
 for(const palette of palettes){
  const entries=Object.entries(palette.colors).filter(([role])=>!query||palette.label.toLowerCase().includes(query)||role.toLowerCase().includes(query));
  if(!entries.length)continue;
  const card=document.createElement('article');card.className='card';
  const heading=document.createElement('h2');heading.textContent=palette.label;card.append(heading);
  const meta=document.createElement('div');meta.className='meta';meta.textContent=palette.id+' · '+(palette.id==='light'||['slate','sepia','lagoon','meadow','rose','honey'].includes(palette.id)?'Light':'Dark');card.append(meta);
  if(palette.id==='ultra'){
   const note=document.createElement('div');note.className='note';note.innerHTML='True-black OLED palette · low-glare chrome, violet-neutral elevation ramp, and a borderless create control that reuses the selected-pill <code>lavender</code> fill.';card.append(note);
  }
  const swatches=document.createElement('div');swatches.className='swatches';
  for(const [role,original] of entries){
   const key=palette.id+'.'+role;const value=edited.get(key)||original;
   const item=document.createElement('div');item.className='swatch'+(edited.has(key)?' edited':'');
   const color=document.createElement('div');color.className='color';color.style.background=value;
   const picker=document.createElement('input');picker.type='color';picker.value=/^#[0-9a-f]{6}$/i.test(value)?value:'#777777';picker.setAttribute('aria-label',`Change ${palette.label} ${role}, currently ${value}`);picker.addEventListener('input',()=>{const next=picker.value.toUpperCase();edited.set(key,next);color.style.background=next;hex.textContent=next;item.classList.add('edited');picker.setAttribute('aria-label',`Change ${palette.label} ${role}, currently ${next}`)});color.append(picker);
   const info=document.createElement('div');info.className='info';const name=document.createElement('div');name.className='role';name.textContent=role;name.title=role;const hex=document.createElement('div');hex.className='hex';hex.textContent=value;info.append(name,hex);item.append(color,info);swatches.append(item);
  }
  card.append(swatches);grid.append(card);
 }
}
filter.addEventListener('input',render);document.querySelector('#reset').addEventListener('click',()=>{edited.clear();render()});render();
</script>
