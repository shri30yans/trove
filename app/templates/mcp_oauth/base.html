<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>{{ title }} · Trove</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101714; color: #f3f4ec; }
      main { width: min(92vw, 440px); box-sizing: border-box; padding: 32px; border: 1px solid #3b4941; border-radius: 24px; background: #18211c; }
      h1 { margin: 0 0 10px; font-size: 25px; }
      p { line-height: 1.55; color: #c5cec5; }
      label { display: block; margin: 18px 0 6px; font-size: 14px; }
      input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #657168; border-radius: 10px; background: #111914; color: #f3f4ec; font: inherit; }
      button { margin-top: 18px; width: 100%; min-height: 46px; padding: 10px 14px; border: 0; border-radius: 12px; background: #b8e77a; color: #152015; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
      button.secondary { border: 1px solid #657168; background: transparent; color: #f3f4ec; }
      .error { color: #ffb3a9; }
      .scope { padding: 14px; border-radius: 12px; background: #111914; }
      small { color: #aeb9b0; }
      a { color: #b8e77a; overflow-wrap: anywhere; }
    </style>
  </head>
  <body><main><h1>{{ title }}</h1>{% block content %}{% endblock %}</main></body>
</html>
