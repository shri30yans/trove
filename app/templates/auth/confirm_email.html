<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Confirm your Trove account</title>
    <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #292631; background: #f4f2ef; }
    body { box-sizing: border-box; min-height: 100vh; margin: 0; padding: 32px 16px; display: grid; place-items: center; }
    main { box-sizing: border-box; width: min(100%, 440px); padding: 32px; border: 1px solid #e9e5e0; border-radius: 16px; background: #fff; }
    h1 { margin: 0 0 12px; font-family: Georgia, serif; font-size: 26px; font-weight: 600; }
    p { margin: 0 0 20px; color: #4a4858; font-size: 15px; line-height: 1.55; }
    .brand { margin-bottom: 12px; color: #6b4fa0; font-weight: 700; letter-spacing: 0.04em; }
    .brand-logo { display: block; width: 52px; height: 52px; margin-bottom: 12px; object-fit: contain; }
    a { display: inline-block; padding: 13px 20px; border-radius: 8px; background: #6b4fa0; color: #fff; font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 3px solid #292631; outline-offset: 3px; }
    #open-app[hidden] { display: none; }
    #fallback { margin-top: 18px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <img class="brand-logo" src="/brand/trove.png" alt="Trove logo">
    <p class="brand">TROVE</p>
    <h1 id="title">Confirming your email</h1>
    <p id="message" aria-live="polite">Please wait while Trove confirms your email address.</p>
    <a id="open-app" href="trove://confirm-email" hidden>Open Trove</a>
    <p id="fallback" hidden>If Trove does not open, return to the app and sign in with your email and password.</p>
  </main>
  <script nonce="{{ script_nonce }}">
    (() => {
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const openApp = document.getElementById('open-app');
      const fallback = document.getElementById('fallback');
      const fragment = new URLSearchParams(window.location.hash.slice(1));
      const tokenHash = fragment.get('token_hash');
      const type = fragment.get('type');
      // Keep the one-time verifier out of browser history and HTTP request logs.
      window.history.replaceState(null, '', window.location.pathname);

      const showFailure = (text) => {
        title.textContent = 'Confirmation link unavailable';
        message.textContent = text;
        fallback.hidden = false;
      };

      if (!tokenHash || type !== 'signup') {
        showFailure('This confirmation link is invalid or expired. Return to Trove and request a new one.');
        return;
      }

      fetch('/v1/auth/confirm-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token_hash: tokenHash }),
      }).then(async (response) => {
        const result = await response.json();
        if (!response.ok) throw new Error('confirmation_failed');
        if (result.status !== 'authenticated' || !result.session) {
          if (result.status !== 'email_confirmed') throw new Error('confirmation_failed');
          title.textContent = 'Email confirmed';
          message.textContent = 'Your email is confirmed. Return to Trove and sign in.';
          fallback.hidden = false;
          return;
        }

        const { accessToken, refreshToken, expiresIn, tokenType } = result.session;
        if (!accessToken || !refreshToken || !Number.isInteger(expiresIn) || expiresIn <= 0 || tokenType !== 'Bearer') {
          throw new Error('confirmation_failed');
        }
        title.textContent = 'Email confirmed';
        message.textContent = 'Your email is confirmed. Open Trove to finish signing in.';
        const callback = new URLSearchParams({
          access_token: accessToken,
          refresh_token: refreshToken,
          expires_in: String(expiresIn),
          token_type: 'bearer',
          type: 'signup',
        });
        openApp.href = `trove://confirm-email#${callback.toString()}`;
        openApp.hidden = false;
        fallback.hidden = false;
      }).catch(() => {
        showFailure('This confirmation link could not be verified. Return to Trove and sign in, or request a new link.');
      });
    })();
  </script>
</body>
</html>
